<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description"
        content="Professional PDF Editor & Document Annotator within the Global Notes ecosystem. Draw, highlight, add text, and export annotated PDF documents seamlessly.">
    <title>PDF Editor & Annotator - Global Notes Workspace</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/CSS/index.css">
    <link rel="stylesheet" href="/CSS/pdf-editor.css">
    <link rel="icon" type="image/png" href="/assets/images/logo_workspace.png" />
    <script type="module" src="/JS/authGuard.js"></script>
</head>

<body class="pdf-editor-page">

    <!-- Header Navigation -->
    <header class="pdf-header">
        <div class="header-left">
            <a href="/app.html" class="btn ghost icon-only back-btn" title="Back to Notes Workspace">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            <a href="/index.html" class="header-brand">
                <img src="/assets/images/logo_dark.png" alt="Global Notes Workspace" class="logo-img">
                <h1 class="brand-h1">PDF <span class="brand-accent">Editor & Annotator</span></h1>
            </a>

            <!-- Apps & Tools Dropdown -->
            <div class="dropdown-wrapper" id="apps-dropdown-wrapper" style="margin-left: 8px;">
                <button class="nav-feature-pill nav-apps-pill" id="apps-dropdown-toggle" title="Workspace Apps & Tools">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
                        <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                        <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                        <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                        <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                    </svg>
                    <span class="nav-pill-text">Apps & Tools ✦</span>
                    <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:12px;height:12px;margin-left:2px;">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>

                <div class="dropdown-menu hidden" id="apps-menu" style="width: 220px;">
                    <div class="dropdown-header">Workspace Tools</div>
                    <a href="/app.html" class="dropdown-item" id="nav-notes-app" title="Notes & Workspace">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                        </svg>
                        <span>Notes App</span>
                    </a>
                    <a href="/HTML/code-workspace.html" class="dropdown-item" id="nav-code" title="Code Workspace">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                        <span>Code Workspace</span>
                    </a>
                    <a href="/HTML/student-hub.html" class="dropdown-item" id="nav-student" title="Student Hub">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                            <path d="M6 12v5c0 2 2.67 3 6 3s6-1 6-3v-5"></path>
                        </svg>
                        <span>Student Hub</span>
                    </a>
                    <a href="/HTML/ui-designer.html" class="dropdown-item" id="nav-ui-designer" title="UI Designer AI">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;">
                            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <span>UI Designer AI</span>
                    </a>
                    <a href="/HTML/pdf-editor.html" class="dropdown-item active" id="nav-pdf-editor-page" title="PDF Editor & Annotator">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        <span>PDF Editor</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="header-right">
            <span class="doc-badge" id="pdf-file-name">No PDF loaded</span>
        </div>
    </header>

    <!-- Main PDF Workspace Layout -->
    <div class="pdf-app-container">
        <!-- Top Toolbar -->
        <div class="pdf-app-toolbar">
            <div class="toolbar-section">
                <label class="btn primary file-input-label">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> Open PDF Document
                    <input type="file" id="pdf-file-input" accept=".pdf" class="hidden">
                </label>
            </div>

            <div class="pdf-tool-divider"></div>

            <div class="toolbar-section tools-group">
                <button class="btn ghost pdf-tool-btn active" id="pdf-tool-draw" title="Draw/Pen">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg> Pen Tool
                </button>
                <button class="btn ghost pdf-tool-btn" id="pdf-tool-highlight" title="Highlighter">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><path d="m9 11-6 6v3h3l6-6m-3-3 6.5-6.5a2.121 2.121 0 0 1 3 3L12 14m-3-3 3 3"/></svg> Highlight
                </button>
                <button class="btn ghost pdf-tool-btn" id="pdf-tool-text" title="Add Text">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg> Text Note
                </button>
                <div class="mobile-pdf-tool-select-wrapper">
                    <select id="mobile-pdf-tool-select" class="mobile-pdf-tool-select" aria-label="Select Tool">
                        <option value="draw">✏️ Pen Tool</option>
                        <option value="highlight">🖍️ Highlighter</option>
                        <option value="text">🔤 Text Note</option>
                        <option value="clear">🗑️ Clear Page</option>
                    </select>
                </div>
                <input type="color" id="pdf-color-picker" value="#3b82f6" title="Annotation Color" class="color-picker-input">
                <button class="btn ghost" id="pdf-clear-draw" title="Clear Canvas Annotations">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Clear Page
                </button>
            </div>

            <div class="pdf-tool-divider"></div>

            <div class="toolbar-section nav-group">
                <button class="btn ghost icon-only" id="pdf-prev-page" title="Previous Page">◀</button>
                <span class="pdf-page-num" id="pdf-page-num">Page 0 / 0</span>
                <button class="btn ghost icon-only" id="pdf-next-page" title="Next Page">▶</button>
            </div>

            <div class="pdf-tool-divider"></div>

            <div class="toolbar-section actions-group">
                <button class="btn secondary" id="pdf-attach-note-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Save to Note
                </button>
                <button class="btn accent" id="pdf-export-btn" style="background: #10b981; border: 1px solid #059669; color: white;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export PDF
                </button>
            </div>
        </div>

        <!-- Canvas Viewport -->
        <main class="pdf-app-viewport">
            <div class="pdf-viewer-container" id="pdf-viewer-container">
                <div class="pdf-canvas-wrapper" id="pdf-canvas-wrapper">
                    <canvas id="pdf-render-canvas"></canvas>
                    <canvas id="pdf-draw-canvas"></canvas>
                </div>
            </div>
        </main>
    </div>

    <!-- Save to Note Modal -->
    <dialog id="save-note-modal" class="modal" style="background: var(--surface, #1e1e24); border: 1px solid var(--border, rgba(255, 255, 255, 0.18)); border-radius: 16px; color: white; width: min(92vw, 460px); margin: auto; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px);">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px;">
        <h3 style="margin: 0; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save Annotation to Note
        </h3>
        <button id="close-save-note-modal" style="background: transparent; border: none; color: #94a3b8; font-size: 18px; cursor: pointer;">✕</button>
      </div>

      <form id="save-note-form" style="display: flex; flex-direction: column; gap: 16px;">
        <div>
          <label style="display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px;">Note Title</label>
          <input type="text" id="pdf-note-title-input" required placeholder="e.g. Annotated PDF - Document (Page 1)" style="width: 100%; background: #0f172a; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 10px; color: white; font-size: 13.5px; outline: none;" />
        </div>

        <div>
          <label style="display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px;">Select Target Folder</label>
          <select id="pdf-folder-select" style="width: 100%; background: #0f172a; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 10px; color: white; font-size: 13.5px; outline: none; cursor: pointer;">
            <option value="">📁 General / No Folder</option>
          </select>
        </div>

        <div style="background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 10px; display: flex; align-items: center; gap: 12px;">
          <div id="pdf-preview-thumbnail" style="width: 60px; height: 60px; background: #000; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"></div>
          <div>
            <div style="font-size: 12.5px; font-weight: 600; color: #e2e8f0;">Embedded Annotation Image</div>
            <div style="font-size: 11px; color: #64748b;" id="pdf-note-page-info">Page 1 Canvas Screenshot</div>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px;">
          <button type="button" id="cancel-save-note-btn" class="btn ghost btn-sm" style="color: #94a3b8;">Cancel</button>
          <button type="submit" id="confirm-save-note-btn" class="btn primary btn-sm" style="background: var(--primary, #6366f1); color: white; font-weight: 600;">Save Note to Database</button>
        </div>
      </form>
    </dialog>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- PDF & App Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script type="module" src="/JS/config.js"></script>
    <script type="module" src="/JS/pdfEditor.js"></script>
</body>

</html>
