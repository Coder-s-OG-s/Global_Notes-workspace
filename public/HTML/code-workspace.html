<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description"
        content="A powerful, AI-driven code workspace for snippets, documentation, and code improvement within the Global Notes ecosystem.">
    <title>Code Workspace - Global Notes Workspace</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

    <link rel="stylesheet" href="../CSS/index.css">
    <link rel="stylesheet" href="../CSS/code-workspace.css">
    <link rel="icon" type="image/png" href="../assets/images/logo_workspace.png" />
</head>

<body class="code-workspace-page">

    <div id="api-warning" class="api-warning-banner hidden">
        ⚠ AI features disabled. Ensure your Groq API key is set in JS/config.js.
    </div>

    <header class="code-header">
        <div class="header-left">
            <a href="../app.html" class="btn ghost icon-only back-btn" title="Back to Home">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            <a href="../index.html" class="header-brand">
                <img src="../assets/images/logo_workspace.png" alt="Global Notes Workspace" class="logo-img">
                <h1 class="brand-h1">Global Code <span class="brand-accent">Workspace</span></h1>
            </a>
            <button class="btn ghost icon-only" id="toggle-sidebar-btn" title="Toggle Snippets Sidebar" style="margin-left: 12px;">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                </svg>
            </button>
        </div>

        <div class="header-center">
            <select id="language-selector" class="lang-select">
                <optgroup label="Popular">
                    <option value="javascript">JavaScript</option>
                    <option value="typescript">TypeScript</option>
                    <option value="python">Python</option>
                    <option value="python3">Python 3</option>
                </optgroup>
                <optgroup label="Systems & App">
                    <option value="cpp">C++</option>
                    <option value="c">C</option>
                    <option value="rust">Rust</option>
                    <option value="go">Go</option>
                    <option value="kotlin">Kotlin</option>
                    <option value="swift">Swift</option>
                </optgroup>
                <optgroup label="Backend & Script">
                    <option value="java">Java</option>
                    <option value="csharp">C#</option>
                    <option value="ruby">Ruby</option>
                    <option value="php">PHP</option>
                    <option value="dart">Dart</option>
                    <option value="scala">Scala</option>
                </optgroup>
                <optgroup label="Functional">
                    <option value="elixir">Elixir</option>
                    <option value="erlang">Erlang</option>
                    <option value="racket">Racket</option>
                </optgroup>
                <optgroup label="Web & Data">
                    <option value="htmlmixed">HTML</option>
                    <option value="css">CSS</option>
                    <option value="sql">SQL</option>
                </optgroup>
            </select>
        </div>

        <div class="header-right-ai">
            <button class="btn primary ai-btn" id="ai-suggest-btn" title="Get AI Code Suggestions & Auto-Fix">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                <span class="btn-text">AI Suggest</span>

            </button>
            <button class="btn ghost ai-btn" id="ai-explain-btn" title="Explain Code">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M9.663 17h4.674"></path>
                    <path d="M10 20h4"></path>
                    <path d="M12 2v1"></path>
                    <path d="M12 15v2"></path>
                    <path d="M15.22 3.78l-.707.707"></path>
                    <path d="M8.78 14.22l-.707.707"></path>
                    <path d="M21.363 8.663h-1"></path>
                    <path d="M3.637 15.337h1"></path>
                    <path d="M19.363 15.337h1"></path>
                    <path d="M4.637 8.663h1"></path>
                    <path d="M15.22 14.22l.707.707"></path>
                    <path d="M8.78 3.78l.707.707"></path>
                    <circle cx="12" cy="11" r="4"></circle>
                </svg>
                <span class="btn-text">Explain</span>
            </button>
            <button class="btn ghost ai-btn" id="ai-docs-btn" title="Generate Docs">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span class="btn-text">Docs</span>
            </button>
            <button class="btn ghost ai-btn" id="ai-improve-btn" title="Improve Code">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
                <span class="btn-text">Improve</span>
            </button>
            <button class="btn ghost ai-btn" id="ai-analyze-btn" title="Analyze Complexity (Big-O)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span class="btn-text">Complexity</span>
            </button>
            <button class="btn ghost ai-btn" id="ai-debug-btn" title="Find and Fix Code Bugs">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                    <path d="M12 2v3M12 11v9M8 5h8M6 8l3 3M18 8l-3 3M4 14h2M18 14h2M5 19h2M17 19h2"></path>
                </svg>
                <span class="btn-text">Debug</span>
            </button>
            <button class="btn ghost ai-btn" id="ai-visualize-flowchart-btn" title="Visualize Code as Flowchart">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="8" y="2" width="8" height="5" rx="1"></rect>
                    <rect x="8" y="17" width="8" height="5" rx="1"></rect>
                    <line x1="12" y1="7" x2="12" y2="17"></line>
                    <polyline points="10 15 12 17 14 15"></polyline>
                </svg>
                <span class="btn-text">Visualize</span>
            </button>
        </div>

        <div class="header-right-utils">
            <a href="student-hub.html" class="btn ghost icon-only" id="nav-student" title="Student Hub" style="margin-right: 8px;">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" style="width:14px;height:14px;">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                    <path d="M6 12v5c0 2 2.67 3 6 3s6-1 6-3v-5"></path>
                </svg>
            </a>
            <!-- Theme Quick Toggle -->
            <button class="btn ghost icon-only" id="theme-quick-toggle" title="Toggle Light/Dark Mode">
                <svg class="icon theme-icon-sun hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="icon theme-icon-moon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <button class="btn primary icon-only" id="copy-code-btn" title="Copy Code">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                   <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                   <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </button>
            <button class="btn primary" id="save-snippet-btn">Save</button>
        </div>
    </header>

    <main class="code-layout">
        <aside class="code-sidebar">
            <div class="sidebar-top">
                <button class="btn primary full-width" id="new-snippet-btn">
                    + New Snippet
                </button>
                <div class="search-wrapper">
                    <svg class="search-icon-fixed" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="snippet-search" class="search-input" placeholder="Search snippets..." autocomplete="off">
                    <button class="search-clear-btn hidden" id="snippet-search-clear" aria-label="Clear search">✕</button>
                    <div class="search-results-dropdown hidden" id="snippet-search-dropdown"></div>
                </div>
            </div>

            <ul class="snippets-list" id="snippets-list">
                <!-- Snippets will be injected here -->
            </ul>
        </aside>
        <div class="sidebar-overlay-code" id="sidebar-overlay-code"></div>

        <section class="code-editor-container">
            <div class="editor-header-bar">
                <div class="editor-tab active">
                    <span class="tab-lang-icon" id="editor-tab-icon">⚡</span>
                    <span class="tab-title" id="editor-tab-title">Untitled Snippet</span>
                    <span class="tab-badge" id="editor-tab-lang">JavaScript</span>
                </div>
                <div class="editor-status-bar">
                    <span class="status-item" id="editor-line-count">Lines: 1</span>
                    <span class="status-item" id="editor-char-count">Chars: 0</span>
                    <span class="status-item">UTF-8</span>
                    <span class="status-item">Spaces: 4</span>
                </div>
            </div>
            <div id="editor-target"></div>

            <!-- AI Result Panel -->
            <div id="ai-result-panel" class="ai-result-container">
                <div class="ai-panel-resizer" id="ai-panel-resizer"></div>
                <div class="ai-panel-header">
                    <div class="ai-panel-title" id="ai-panel-title">AI Assistant</div>
                    <div class="ai-panel-actions">
                        <button class="panel-action-btn" id="expand-panel-btn" title="Expand/Collapse">⤢</button>
                        <button class="panel-close-btn" id="close-panel-btn">×</button>
                    </div>
                </div>
                <div class="ai-panel-content" id="ai-panel-content">
                    <!-- AI Response goes here -->
                </div>
            </div>
        </section>
    </main>

    <!-- Confirm Dialog -->
    <dialog class="confirm-dialog" id="confirm-dialog">
        <div class="confirm-content">
            <button class="confirm-close" aria-label="Close dialog">✕</button>
            <h3 class="confirm-title" id="confirm-title">Delete Snippet</h3>
            <p class="confirm-message" id="confirm-message">Are you sure? This cannot be undone.</p>
            <div class="confirm-actions">
                <button class="btn secondary" id="confirm-cancel">Cancel</button>
                <button class="btn danger" id="confirm-ok">Delete</button>
            </div>
        </div>
    </dialog>

    <!-- Prompt Dialog -->
    <dialog class="confirm-dialog" id="prompt-dialog">
        <div class="confirm-content">
            <button class="confirm-close" aria-label="Close dialog">✕</button>
            <h3 class="confirm-title" id="prompt-title">Enter Details</h3>
            <div class="prompt-body">
                <input type="text" id="prompt-input" class="prompt-input-field" placeholder="Type here..." autocomplete="off">
            </div>
            <div class="confirm-actions">
                <button class="btn secondary" id="prompt-cancel">Cancel</button>
                <button class="btn primary" id="prompt-ok">OK</button>
            </div>
        </div>
    </dialog>

    <!-- Alert Dialog -->
    <dialog class="confirm-dialog" id="alert-dialog">
        <div class="confirm-content">
            <button class="confirm-close" aria-label="Close dialog">✕</button>
            <h3 class="confirm-title" id="alert-title">Alert</h3>
            <p class="confirm-message" id="alert-message">Something happened.</p>
            <div class="confirm-actions">
                <button class="btn primary" id="alert-ok">OK</button>
            </div>
        </div>
    </dialog>

    <div id="toast" class="notification-toast">Snippet Saved!</div>

    <!-- Floating AI Chat will be injected by JS -->

    <!-- CodeMirror Core JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>

    <!-- Languages Support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/sql/sql.min.js"></script>

    <!-- CodeMirror Addons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closetag.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/comment/comment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/selection/active-line.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/search.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/searchcursor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/jump-to-line.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/dialog/dialog.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/dialog/dialog.min.css">



    <!-- PDF Generation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- App logic -->
    <script type="module" src="../JS/codeWorkspace.js"></script>
</body>

</html>
